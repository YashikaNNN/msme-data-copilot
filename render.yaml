# Render Blueprint: backend API + Postgres
# Deploy: Render Dashboard → New → Blueprint → connect YashikaNNN/msme-data-copilot

databases:
  - name: msme-copilot-db
    plan: free
    databaseName: msme_copilot
    user: msme

services:
  - type: web
    name: msme-copilot-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: APP_ENV
        value: production
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: DATABASE_URL
        fromDatabase:
          name: msme-copilot-db
          property: connectionString
      - key: CORS_ORIGINS
        sync: false
        # Set after Vercel deploy, e.g. https://msme-data-copilot.vercel.app
      - key: LLM_PROVIDER
        value: none
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
